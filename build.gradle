plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.80'
}

version = mod_version
group = 'fr.citizen.citizencraft'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // => net.neoforged:neoforge:21.1.215 (version imposée)
    version = project.neo_version

    runs {
        client {
            client()
        }
        // Autotest (GitHub Actions) : demarre un vrai serveur, verifie /craft, puis s'arrete.
        server {
            server()
            gameDirectory = project.file('run')
            systemProperty 'citizencraft.selftest', 'true'
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
